name: Agent / Caption Update

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Episode ID used as filename prefix (e.g. ep01)"
        required: true
      youtube_url:
        description: "Full YouTube video URL"
        required: true

jobs:
  caption:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install .agent dependencies
        run: |
          set -euo pipefail
          cd .agent
          npm ci

      - name: Install yt-dlp
        run: pipx install yt-dlp

      - name: Download EN auto-captions
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
        run: |
          set -euo pipefail
          yt-dlp \
            --write-auto-sub \
            --sub-lang en \
            --sub-format vtt \
            --no-warnings \
            --skip-download \
            -o '/tmp/caption' \
            "$YOUTUBE_URL"
          # yt-dlp appends .en.vtt; verify the file exists
          ls /tmp/caption*.vtt

      - name: Convert VTT to markdown
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          set -euo pipefail
          VTT_FILE=$(ls /tmp/caption*.en.vtt 2>/dev/null | head -1)
          if [ -z "$VTT_FILE" ]; then
            VTT_FILE=$(ls /tmp/caption*.vtt 2>/dev/null | head -1)
          fi
          if [ -z "$VTT_FILE" ]; then
            echo "No VTT file found" >&2
            exit 1
          fi
          node .agent/scripts/vtt-to-md.js "$VTT_FILE" \
            "content/captions/$EPISODE_ID.en.md"

      - name: Translate to Chinese
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          set -euo pipefail
          node .agent/scripts/translate-caption.js \
            "content/captions/$EPISODE_ID.en.md" \
            "content/captions/$EPISODE_ID.zh.md"

      - name: Create branch and commit captions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="caption/$EPISODE_ID"
          git checkout -B "$BRANCH"
          git add \
            "content/captions/$EPISODE_ID.en.md" \
            "content/captions/$EPISODE_ID.zh.md"
          git commit -m "captions: add $EPISODE_ID EN+ZH transcripts"
          git push --force origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          set -euo pipefail
          BRANCH="caption/$EPISODE_ID"
          cat > /tmp/pr-body.md <<EOF
          Automated caption PR for episode \`$EPISODE_ID\`.

          - Downloads EN auto-captions from YouTube via yt-dlp
          - Converts VTT to clean paragraph markdown
          - Translates to Simplified Chinese via Claude API

          Generated by the \`agent-caption-update\` workflow.
          EOF
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH, skipping."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "captions: add $EPISODE_ID EN+ZH transcripts" \
              --body-file /tmp/pr-body.md
          fi
