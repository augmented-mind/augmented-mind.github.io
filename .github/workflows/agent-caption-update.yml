name: Agent / Caption Update

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Episode ID used as filename prefix (e.g. ep01)"
        required: true
      youtube_url:
        description: "Full YouTube video URL"
        required: true

jobs:
  caption:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install .agent dependencies
        run: |
          set -euo pipefail
          cd .agent
          npm ci

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download EN auto-captions
        run: |
          set -euo pipefail
          yt-dlp \
            --write-auto-sub \
            --sub-lang en \
            --sub-format vtt \
            --no-warnings \
            --skip-download \
            -o '/tmp/caption' \
            "${{ inputs.youtube_url }}"
          # yt-dlp appends .en.vtt; verify the file exists
          ls /tmp/caption*.vtt

      - name: Convert VTT to markdown
        run: |
          set -euo pipefail
          VTT_FILE=$(ls /tmp/caption*.en.vtt 2>/dev/null | head -1)
          if [ -z "$VTT_FILE" ]; then
            VTT_FILE=$(ls /tmp/caption*.vtt 2>/dev/null | head -1)
          fi
          if [ -z "$VTT_FILE" ]; then
            echo "No VTT file found" >&2
            exit 1
          fi
          node .agent/scripts/vtt-to-md.js "$VTT_FILE" \
            "content/captions/${{ inputs.episode_id }}.en.md"

      - name: Translate to Chinese
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          node .agent/scripts/translate-caption.js \
            "content/captions/${{ inputs.episode_id }}.en.md" \
            "content/captions/${{ inputs.episode_id }}.zh.md"

      - name: Create branch and commit captions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="caption/${{ inputs.episode_id }}"
          git checkout -b "$BRANCH"
          git add \
            "content/captions/${{ inputs.episode_id }}.en.md" \
            "content/captions/${{ inputs.episode_id }}.zh.md"
          git commit -m "captions: add ${{ inputs.episode_id }} EN+ZH transcripts"
          git push origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'PRBODY'
          Automated caption PR for episode `${{ inputs.episode_id }}`.

          - Downloads EN auto-captions from YouTube via yt-dlp
          - Converts VTT to clean paragraph markdown
          - Translates to Simplified Chinese via Claude API

          Generated by the `agent-caption-update` workflow.
          PRBODY
          gh pr create \
            --base main \
            --head "caption/${{ inputs.episode_id }}" \
            --title "captions: add ${{ inputs.episode_id }} EN+ZH transcripts" \
            --body-file /tmp/pr-body.md
