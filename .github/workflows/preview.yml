name: Preview (sepo)
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions: { id-token: write, contents: read, pull-requests: write }
concurrency:
  group: sepo-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build site
        run: |
          npm ci
          npx quartz build          # -> ./public
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with: { name: sepo-preview-site, path: ./public, retention-days: 1, if-no-files-found: error }
      - name: Deploy preview
        id: deploy
        env:
          SERVER_URL: https://preview-api.sepo.sh
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sepo-preview" | jq -r '.value')
          RESP=$(curl -sS -X POST "$SERVER_URL/api/deploy/preview" -H 'Content-Type: application/json' \
                 --data "$(jq -nc --arg t "$TOK" --argjson a "$ARTIFACT_ID" '{oidc_token:$t,artifact_id:$a}')" \
                 -w '\n%{http_code}')
          CODE=$(tail -n1 <<<"$RESP"); BODY=$(sed '$d' <<<"$RESP"); echo "$BODY"
          [[ "$CODE" == 200 ]] || { echo "::error::deploy failed ($CODE)"; exit 1; }
          URL=$(jq -r .url <<<"$BODY")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🔎 Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment URL
        if: github.event_name == 'pull_request'
        env: { GH_TOKEN: "${{ github.token }}", URL: "${{ steps.deploy.outputs.url }}" }
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body "🔎 Sepo preview: $URL"
  teardown:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Teardown preview
        env: { SERVER_URL: https://preview-api.sepo.sh }
        run: |
          set -euo pipefail
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sepo-preview" | jq -r '.value')
          curl -sS -X POST "$SERVER_URL/api/deploy/teardown" -H 'Content-Type: application/json' \
               --data "$(jq -nc --arg t "$TOK" '{oidc_token:$t}')" -w '\n%{http_code}'
